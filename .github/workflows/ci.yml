name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm.cmd ci

      - name: Verify third-party dependency notices
        shell: pwsh
        run: |
          npm.cmd run notices
          if ($LASTEXITCODE -ne 0) {
            throw "Third-party notice generation failed."
          }
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Check TypeScript
        run: npm.cmd run check

      - name: Check project site TypeScript
        run: npm.cmd run check:site

      - name: Run frontend tests
        run: npm.cmd run test:frontend

      - name: Build frontend
        run: npm.cmd run build

      - name: Build project site
        run: npm.cmd run build:site

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build standalone release executable
        run: npm.cmd run release

      - name: Verify Release CLI feedback and exit status
        run: npm.cmd run test:cli

  linux:
    name: Verify Linux build and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux build dependencies
        run: bash scripts/setup-linux.sh deps

      - name: Verify vendored source and build frontend
        run: |
          npm ci
          node --test --test-timeout=30000 tests/repository-publication.test.mjs
          npm run build

      - name: Run Linux Rust tests including glib regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run optimized glib regression
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_variant_str_iter

      - name: Build Linux DEB and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run release:linux

      - name: Verify Linux CLI and installation packages
        run: |
          npm run test:cli
          node scripts/verify-linux-packages.mjs
          node scripts/release-assets.mjs --platform linux

      - name: Install fixed WebDriver
        run: bash scripts/setup-linux.sh webdriver

      - name: Exercise real Linux WebView
        run: xvfb-run -a node tests/linux-webdriver.mjs

      - name: Preserve Linux smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-smoke-diagnostics
          path: artifacts/linux-smoke
          if-no-files-found: ignore
          retention-days: 7
