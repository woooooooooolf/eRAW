name: Release

on:
  push:
    tags:
      - "V*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require a version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "tag") {
            throw "Release must run from a pushed tag."
          }

          $tag = $env:RELEASE_TAG
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -cne "V$packageVersion") {
            throw "Tag $tag does not match package version V$packageVersion."
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm.cmd ci

      - name: Verify third-party dependency notices
        shell: pwsh
        run: |
          npm.cmd run notices
          if ($LASTEXITCODE -ne 0) {
            throw "Third-party notice generation failed."
          }
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Check TypeScript
        run: npm.cmd run check

      - name: Run frontend tests
        run: npm.cmd run test:frontend

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build release executable
        run: npm.cmd run release

      - name: Prepare release asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $assetDirectory = "artifacts"
          $assetPath = "$assetDirectory/eRAW-$tag-windows-x64.exe"
          $licensePath = "$assetDirectory/THIRD_PARTY_LICENSES.txt"
          $sbomPath = "$assetDirectory/eRAW-$tag.spdx.json"
          $checksumPath = "$assetDirectory/eRAW-$tag-SHA256SUMS.txt"

          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/eraw.exe" -Destination $assetPath
          npm.cmd run notices -- --licenses $licensePath
          if ($LASTEXITCODE -ne 0) {
            throw "Third-party license collection failed."
          }

          $sbomResponse = gh api "repos/$env:GITHUB_REPOSITORY/dependency-graph/sbom" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $sbomResponse.sbom) {
            throw "GitHub dependency SBOM export failed."
          }
          $sbomResponse.sbom | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $sbomPath -Encoding utf8

          @($assetPath, $licensePath, $sbomPath) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "RELEASE_ASSET=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_LICENSES=$licensePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SBOM=$sbomPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUMS=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest release executable
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.RELEASE_ASSET }}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_ASSET $env:RELEASE_CHECKSUMS $env:RELEASE_SBOM $env:RELEASE_LICENSES --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $env:RELEASE_ASSET $env:RELEASE_CHECKSUMS $env:RELEASE_SBOM $env:RELEASE_LICENSES `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "eRAW $tag" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
