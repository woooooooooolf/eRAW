name: Release

on:
  push:
    tags:
      - "V*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} x64 release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: npm run release
          - platform: linux
            runner: ubuntu-24.04
            command: npm run release:linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Require matching version tag and Chinese release notes
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== "V"+p.version) throw Error("Tag must match package version")'
          node scripts/validate-release-notes.mjs "docs/releases/$RELEASE_TAG.md"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/setup-linux.sh deps

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify third-party dependency notices
        run: |
          npm run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Check TypeScript
        run: npm run check

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build release artifacts
        run: ${{ matrix.command }}

      - name: Verify Release CLI feedback and exit status
        run: npm run test:cli

      - name: Verify Linux packages
        if: matrix.platform == 'linux'
        run: node scripts/verify-linux-packages.mjs

      - name: Verify optimized Linux regression and real WebView
        if: matrix.platform == 'linux'
        run: |
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_variant_str_iter
          bash scripts/setup-linux.sh webdriver
          ERAW_TEST_OUTPUT=/tmp/eraw-linux-smoke xvfb-run -a node tests/linux-webdriver.mjs

      - name: Prepare release assets
        run: node scripts/release-assets.mjs --platform "$RELEASE_PLATFORM"

      - name: Attest release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.AppImage

      - name: Transfer verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Collect all verified assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs
