name: Bug report / 缺陷报告
description: Report a reproducible defect in existing behavior / 报告既有功能中的可复现缺陷
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve eRAW. Please describe one reproducible defect per report.
        感谢帮助改进 eRAW。每份报告请只描述一个可复现缺陷。

  - type: input
    id: version
    attributes:
      label: eRAW version / eRAW 版本
      placeholder: V0.5.5
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows and WebView2 / Windows 与 WebView2
      placeholder: Windows 11 24H2; WebView2 1.x
    validations:
      required: true

  - type: textarea
    id: descriptor
    attributes:
      label: RAW descriptor / RAW 描述符
      description: Dimensions, Packing, bit depth, CFA/Phase, offsets, row/frame strides, frame, ROI, and display mode when relevant.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open ...
        2. Set ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics / 实际行为与诊断信息
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context / 补充信息
      description: Screenshots or a minimal redistributable sample may be added when useful. Remove confidential paths and metadata first.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation / 确认
      options:
        - label: I searched existing Issues and did not find the same defect. / 我已搜索现有 Issue，未发现相同缺陷。
          required: true
        - label: Any attached data is mine to disclose and contains no customer, proprietary, or confidential information. / 我有权公开所附数据，且其中不包含客户、专有或机密信息。
          required: true
