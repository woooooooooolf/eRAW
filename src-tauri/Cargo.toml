[package]
name = "eraw"
version = "0.8.0"
description = "RAW sensor data viewer and converter"
authors = ["eRAW contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/woooooooooolf/eRAW"
edition = "2024"
rust-version = "1.90"

[lib]
name = "eraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memmap2 = "0.9"
httpdate = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls-no-alpn", "system-proxy", "socks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
